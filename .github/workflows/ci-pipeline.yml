docker-build:
  name: Docker Build
  runs-on: ubuntu-latest
  needs: test

  steps:

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }} .

    - name: Save Docker Image
      run: docker save -o image.tar ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}

    - name: Upload Docker Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: image.tar